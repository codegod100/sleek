# Install .#android from binary cache (no local compile).
# Hosted Spindle OOMs/kills real nix builds ~3m with no logs.
# Warm the cache first:  nix build .#android && cachix push codegod100 ./result-android

when:
  - event: ["push", "manual"]
    branch: ["main"]
  - event: ["pull_request"]
    branch: ["main"]

engine: microvm
image: nixos

dependencies:
  - git

steps:
  - name: "Substitute APK from cache"
    command: |
      set -euo pipefail
      export NIX_CONFIG="experimental-features = nix-command flakes
      accept-flake-config = true
      max-jobs = 0"
      echo "kind=${TANGLED_PIPELINE_KIND:-?} sha=${TANGLED_SHA:-?}"
      nix --version
      # max-jobs=0 → download only; fail fast if not in codegod100/cache.nixos.org
      if ! nix build .#android --out-link result-android; then
        echo "error: .#android not substitutable. Build+push elsewhere:" >&2
        echo "  nix build .#android --out-link result-android" >&2
        echo "  cachix push codegod100 ./result-android" >&2
        exit 1
      fi
      test -s result-android/sleek.apk
      ls -lah result-android/
