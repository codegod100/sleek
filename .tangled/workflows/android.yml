# Substitute .#android from binary cache only (hosted Spindle cannot compile).
# Warm cache: just android   # or: nix build .#android && cachix push codegod100 ./result-android

when:
  - event: ["push", "manual"]
    branch: ["main"]
  - event: ["pull_request"]
    branch: ["main"]

engine: microvm
image: nixos

dependencies:
  - git

steps:
  - name: "Substitute APK from cache"
    command: |
      set -euo pipefail
      export NIX_CONFIG=$'experimental-features = nix-command flakes\naccept-flake-config = true\nmax-jobs = 0\nextra-substituters = https://codegod100.cachix.org\nextra-trusted-public-keys = codegod100.cachix.org-1:LZFL5VrR644WUjleS3bLbVeOdzlXqzKznQWvD5MVthA='
      echo "kind=${TANGLED_PIPELINE_KIND:-?} sha=${TANGLED_SHA:-?}"
      nix --version
      if ! nix build .#android --out-link result-android \
          --substituters 'https://codegod100.cachix.org https://cache.nixos.org' \
          --trusted-public-keys 'codegod100.cachix.org-1:LZFL5VrR644WUjleS3bLbVeOdzlXqzKznQWvD5MVthA= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY='; then
        echo "error: .#android not in cache. On a machine with Cachix write access:" >&2
        echo "  just android" >&2
        exit 1
      fi
      test -s result-android/sleek.apk
      ls -lah result-android/
