# Probe: can microvm complete a real nix build (.#sleek desktop)?
when:
  - event: ["push", "manual"]
    branch: ["main"]

engine: microvm
image: nixos

dependencies:
  - git

steps:
  - name: "Flake check"
    command: |
      set -euxo pipefail
      export NIX_CONFIG="experimental-features = nix-command flakes
      accept-flake-config = true"
      nix eval .#packages.x86_64-linux.sleek.name --no-write-lock-file

  - name: "Build desktop sleek"
    command: |
      set -euo pipefail
      export NIX_CONFIG="experimental-features = nix-command flakes
      accept-flake-config = true"
      set -o pipefail
      nix build .#sleek --out-link result-sleek 2>&1 | tee /tmp/sleek-build.log
      test -x result-sleek/bin/sleek
      ls -lah result-sleek/bin/
      echo OK
