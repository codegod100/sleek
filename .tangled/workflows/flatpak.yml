# Probe: android dry-run (eval + fetch plan, no compile)
when:
  - event: ["push", "manual"]
    branch: ["main"]

engine: microvm
image: nixos

dependencies:
  - git

steps:
  - name: "Android dry-run"
    command: |
      set -euxo pipefail
      export NIX_CONFIG="experimental-features = nix-command flakes
      accept-flake-config = true"
      nix build .#android --dry-run 2>&1 | tee /tmp/android-dry.log | tail -n 50
      echo OK
