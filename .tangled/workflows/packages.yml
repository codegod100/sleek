# Probe: microvm+nixos without nixpkgs.nix dependency
when:
  - event: ["push", "manual"]
    branch: ["main"]

engine: microvm
image: nixos

dependencies:
  - git
  - hello

steps:
  - name: "Probe"
    command: |
      set -euxo pipefail
      echo "kind=$TANGLED_PIPELINE_KIND sha=${TANGLED_SHA:-n/a}"
      hello
      command -v nix
      nix --version
      echo OK
