# Probe: microvm + flake eval (no full package build yet)
when:
  - event: ["push", "manual"]
    branch: ["main"]

engine: microvm
image: nixos

dependencies:
  - git

steps:
  - name: "Probe flake"
    command: |
      set -euxo pipefail
      echo "kind=$TANGLED_PIPELINE_KIND sha=${TANGLED_SHA:-n/a} pwd=$PWD"
      nix --version
      export NIX_CONFIG="experimental-features = nix-command flakes
      accept-flake-config = true"
      ls -la
      nix flake metadata . --no-write-lock-file
      nix eval .#packages.x86_64-linux.android.name --no-write-lock-file
      nix eval .#packages.x86_64-linux.flatpak.name --no-write-lock-file
      echo OK
