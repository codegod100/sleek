# Minimal probe — confirm nixery + nix work on this spindle.
# Replace with full packages.yml once this is green.

when:
  - event: ["push", "manual"]
    branch: ["main"]

engine: nixery

dependencies:
  nixpkgs:
    - bash
    - nix
    - git

environment:
  NIX_CONFIG: "experimental-features = nix-command flakes"

steps:
  - name: "Probe"
    command: |
      set -euxo pipefail
      echo "kind=$TANGLED_PIPELINE_KIND sha=${TANGLED_SHA:-n/a} pwd=$PWD"
      uname -a
      nix --version
      ls -la
      nix flake show --no-write-lock-file 2>&1 | head -40
      echo OK
