# Minimal spindle pipeline — runs on push/PR/manual
when:
  - event: ["push", "manual"]
    branch: ["main", "master"]
  - event: ["pull_request"]
    branch: ["main", "master"]

engine: "nixery"

dependencies:
  nixpkgs:
    - hello
    - bash

steps:
  - name: "Sanity check"
    command: |
      set -euxo pipefail
      echo "CI is working on $TANGLED_REPO_NAME"
      echo "kind=$TANGLED_PIPELINE_KIND sha=${TANGLED_SHA:-n/a}"
      hello
      uname -a
