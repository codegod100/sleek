[package]
name = "sleek"
version = "0.1.0"
edition = "2021"
description = "Sleek — mobile freeq client with Vidya (egui)"
license = "MIT"
publish = false

# Own workspace root so cargo-apk builds in-tree (mirrors vidya/android-demo).
[workspace]

[lib]
name = "sleek"
path = "src/lib.rs"
# lib-only: cargo-apk panics if this package also has [[bin]] targets
crate-type = ["cdylib", "rlib"]

[dependencies]
vidya = { path = "../../vidya" }
# Guest IRC + freeq events; skip iroh/aws-lc for lighter desktop + Android builds.
freeq-sdk = { path = "../../freeq/freeq-sdk", default-features = false, features = [
    "ring",
    "rustls-tls",
    "websocket",
] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "net",
    "io-util",
] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
anyhow = "1"
log = "0.4"

# Shared glow + fonts only — do NOT enable wayland/x11 here (feature unification
# would pull them into the Android build and can make the activity exit immediately).
eframe = { version = "0.31", default-features = false, features = [
    "default_fonts",
    "glow",
] }

[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "0.31", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
env_logger = "0.11"

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.31", default-features = false, features = [
    "default_fonts",
    "glow",
    "android-native-activity",
] }
android_logger = "0.14"
winit = { version = "0.30", default-features = false, features = ["android-native-activity"] }

[package.metadata.android]
package = "uk.nandi.sleek"
apk_name = "sleek"
build_targets = ["x86_64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 28
target_sdk_version = 34

[package.metadata.android.application]
label = "Sleek"
orientations = ["Portrait", "Landscape"]
