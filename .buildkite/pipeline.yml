# Buildkite CI for sleek (baogui-shaped org layout).
# Mirrors AGENTS.md check commands + GHA artifacts (nix .#android / .#flatpak)
# via nixbuild.net when cluster secrets are present.
#
# Artifacts:
#   - APK: result-android/sleek.apk (streamed via nix store cat)
#   - Flatpak: uk.nandi.sleek.flatpak (streamed; no full closure nix copy)
#
# Secrets (Buildkite cluster → Secrets, org nandi / Default cluster):
#   - NIXBUILD_TOKEN (preferred) — soft-loaded; skip artifacts if missing
#   - OPENBAO_TOKEN (optional) — fetch-openbao-env.sh → NIXBUILD_TOKEN
# UI: https://buildkite.com/organizations/nandi/clusters → Default cluster → Secrets
# Pipeline: https://buildkite.com/nandi/sleek
#
# Pipeline repository (Buildkite): Radicle Garden clone URL
#   https://nandi.radicle.garden/z9mjPzpVK472QXaaP1picc5U9xBR.git
#   RID rad:z9mjPzpVK472QXaaP1picc5U9xBR (not GitHub — baogui-shaped).
#
# Path deps (android/Cargo.toml → ../../vidya, ../../freeq/freeq-sdk) come from
# flake.lock via scripts/sync-flake-path-deps.sh (vidya: Radicle Garden; freeq:
# GitHub). Check runs in `nix develop` so mold + egui/pipewire libs + rustc come
# from the flake (same as local AGENTS.md), not apt/rustup.
#
# Agents must reach nandi.radicle.garden (sleek + vidya RIDs),
# github.com/codegod100/freeq, and Flathub when building Flatpak.
# Hosted queue: auto (LINUX_AMD64_2X4). Use $$ so Buildkite does not interpolate
# shell vars at pipeline-upload time.

agents:
  queue: auto

env:
  RUST_BACKTRACE: "1"

steps:
  - label: ":rust: Check"
    key: check
    timeout_in_minutes: 120
    command: |
      set -euo pipefail

      if command -v apt-get >/dev/null 2>&1; then
        sudo DEBIAN_FRONTEND=noninteractive apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y jq git patch curl ca-certificates
      fi
      command -v jq >/dev/null 2>&1 || {
        echo "jq required to read flake.lock path-dep pins" >&2
        exit 1
      }

      # Nix + flake shell: mold (.cargo/config.toml), rustc, libclang, pipewire, …
      if ! command -v nix >/dev/null 2>&1; then
        curl --proto '=https' --tlsv1.2 -sSf -L \
          https://install.determinate.systems/nix \
          | sh -s -- install linux --no-confirm --init none
        # shellcheck disable=SC1091
        . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh || true
        export PATH="/nix/var/nix/profiles/default/bin:$$PATH"
      fi
      command -v nix >/dev/null 2>&1 || {
        echo "nix not on PATH after install" >&2
        exit 1
      }
      if [[ ! -S /nix/var/nix/daemon-socket/socket ]]; then
        sudo /nix/var/nix/profiles/default/bin/nix daemon >/tmp/nix-daemon-check.log 2>&1 &
        for _ in $$(seq 1 30); do
          [[ -S /nix/var/nix/daemon-socket/socket ]] && break
          sleep 1
        done
      fi

      # Flake nixConfig (cachix substituter) must not prompt (y/N) on agents.
      # Match GHA / ci-nixbuild.sh; also drain stdin so a TTY cannot block.
      sudo mkdir -p /etc/nix
      if ! sudo grep -q 'accept-flake-config' /etc/nix/nix.conf 2>/dev/null; then
        echo 'accept-flake-config = true' | sudo tee -a /etc/nix/nix.conf >/dev/null
      fi
      export NIX_CONFIG=$$'experimental-features = nix-command flakes\naccept-flake-config = true'

      # Path deps: materialize flake.lock pins (vidya Radicle + freeq GitHub).
      bash scripts/sync-flake-path-deps.sh
      parent="$$(dirname "$$PWD")"
      [[ -f "$$parent/vidya/Cargo.toml" ]] || { echo "vidya Cargo.toml missing" >&2; exit 1; }
      [[ -f "$$parent/freeq/freeq-sdk/Cargo.toml" ]] || {
        echo "freeq-sdk Cargo.toml missing" >&2
        exit 1
      }

      echo "--- :nix: develop (mold + rustc from flake)"
      nix develop --option accept-flake-config true --command bash -lc '
        set -euo pipefail
        command -v mold >/dev/null
        rustc --version
        cargo --version
        cargo clippy --manifest-path host/Cargo.toml -- -D warnings
        cargo test --manifest-path android/Cargo.toml --lib
      ' </dev/null

  - label: ":android: APK (nixbuild.net)"
    key: apk
    depends_on: check
    allow_dependency_failure: true
    timeout_in_minutes: 120
    command: |
      set -euo pipefail

      chmod +x scripts/ci-nixbuild.sh scripts/fetch-openbao-env.sh

      creds_out="$$(mktemp)"
      ./scripts/ci-nixbuild.sh resolve-creds | tee "$$creds_out"
      # shellcheck disable=SC1090
      eval "$$(grep -E '^(SKIP|NIXBUILD_CREDS_ENV)=' "$$creds_out")"
      if [[ "$${SKIP:-1}" == "1" ]]; then
        echo "--- :warning: Skipping APK (no nixbuild credentials)"
        exit 0
      fi
      # shellcheck disable=SC1090
      source "$$NIXBUILD_CREDS_ENV"

      setup_out="$$(mktemp)"
      ./scripts/ci-nixbuild.sh setup | tee "$$setup_out"
      setup_env="$$(sed -n 's/^NIXBUILD_SETUP_ENV=//p' "$$setup_out" | tail -1)"
      [[ -n "$$setup_env" && -f "$$setup_env" ]] || {
        echo "ci-nixbuild setup did not emit NIXBUILD_SETUP_ENV" >&2
        exit 1
      }
      # shellcheck disable=SC1090
      source "$$setup_env"

      # Stream sleek.apk only — do not nix-copy the full store closure.
      ./scripts/ci-nixbuild.sh remote-build ".#android" result-android sleek.apk
      [[ -s result-android/sleek.apk ]] || {
        echo "APK missing under result-android/" >&2
        ls -la result-android >&2 || true
        exit 1
      }
      buildkite-agent artifact upload result-android/sleek.apk

  - label: ":package: Flatpak (nixbuild.net)"
    key: flatpak
    depends_on: check
    allow_dependency_failure: true
    timeout_in_minutes: 180
    command: |
      set -euo pipefail

      chmod +x scripts/ci-nixbuild.sh scripts/fetch-openbao-env.sh

      creds_out="$$(mktemp)"
      ./scripts/ci-nixbuild.sh resolve-creds | tee "$$creds_out"
      # shellcheck disable=SC1090
      eval "$$(grep -E '^(SKIP|NIXBUILD_CREDS_ENV)=' "$$creds_out")"
      if [[ "$${SKIP:-1}" == "1" ]]; then
        echo "--- :warning: Skipping Flatpak (no nixbuild credentials)"
        exit 0
      fi
      # shellcheck disable=SC1090
      source "$$NIXBUILD_CREDS_ENV"

      setup_out="$$(mktemp)"
      ./scripts/ci-nixbuild.sh setup | tee "$$setup_out"
      setup_env="$$(sed -n 's/^NIXBUILD_SETUP_ENV=//p' "$$setup_out" | tail -1)"
      [[ -n "$$setup_env" && -f "$$setup_env" ]] || {
        echo "ci-nixbuild setup did not emit NIXBUILD_SETUP_ENV" >&2
        exit 1
      }
      # shellcheck disable=SC1090
      source "$$setup_env"

      # Stream the .flatpak bundle only. Full `nix copy` of the flatpak out
      # pulls multi‑GiB GNOME/runtime closure and OOMs LINUX_AMD64_2X4 agents.
      ./scripts/ci-nixbuild.sh remote-build ".#flatpak" result-flatpak \
        uk.nandi.sleek.flatpak
      bundle="result-flatpak/uk.nandi.sleek.flatpak"
      [[ -s "$$bundle" ]] || {
        echo "Flatpak bundle missing under result-flatpak/" >&2
        ls -lah result-flatpak >&2 || true
        exit 1
      }
      ln -f "$$bundle" uk.nandi.sleek.flatpak 2>/dev/null \
        || cp --reflink=auto "$$bundle" uk.nandi.sleek.flatpak
      buildkite-agent artifact upload uk.nandi.sleek.flatpak
