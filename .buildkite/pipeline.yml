# Buildkite CI for sleek (baogui-shaped org layout).
# Mirrors AGENTS.md check commands + GHA artifacts (nix .#android / .#flatpak)
# via nixbuild.net when cluster secrets are present.
#
# Artifacts:
#   - APK: result-android/sleek.apk
#   - Flatpak: uk.nandi.sleek.flatpak (from nix2flatpak; no naked ELF)
#
# Secrets (Buildkite cluster → Secrets, org nandi / Default cluster):
#   - NIXBUILD_TOKEN (preferred) — soft-loaded; skip artifacts if missing
#   - OPENBAO_TOKEN (optional) — fetch-openbao-env.sh → NIXBUILD_TOKEN
# UI: https://buildkite.com/organizations/nandi/clusters → Default cluster → Secrets
# Pipeline: https://buildkite.com/nandi/sleek
#
# Path deps (android/Cargo.toml → ../../vidya, ../../freeq/freeq-sdk) must match
# flake.lock pins from github:codegod100/{vidya,freeq}. Do not clone tangled tip.
#
# Agents must reach github.com/codegod100/{sleek,vidya,freeq}.
# Hosted queue: auto (LINUX_AMD64_2X4). Use $$ so Buildkite does not interpolate
# shell vars at pipeline-upload time.

agents:
  queue: auto

env:
  RUST_BACKTRACE: "1"

steps:
  - label: ":rust: Check"
    key: check
    command: |
      set -euo pipefail

      if command -v apt-get >/dev/null 2>&1; then
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
          jq git patch binutils build-essential \
          libxkbcommon-dev libxkbcommon-x11-dev \
          libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
          libgl1-mesa-dev libegl1-mesa-dev libvulkan-dev \
          libclang-dev pkg-config libssl-dev cmake g++
        # .cargo/config.toml requests -fuse-ld=mold; jammy may lack the package.
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y mold \
          || echo "mold package unavailable — will clear mold rustflags"
      fi
      command -v jq >/dev/null 2>&1 || {
        echo "jq required to read flake.lock path-dep pins" >&2
        exit 1
      }
      if ! command -v mold >/dev/null 2>&1; then
        echo "--- :warning: mold missing; override .cargo mold rustflags to use system ld"
        export CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS=""
        export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS=""
      fi
      command -v ld >/dev/null 2>&1 || {
        echo "system linker (ld) missing after binutils install" >&2
        exit 1
      }

      # Path deps: pin to flake.lock revs (github:codegod100/{vidya,freeq}).
      parent="$$(dirname "$$PWD")"
      vidya_dir="$$parent/vidya"
      freeq_dir="$$parent/freeq"
      vidya_rev="$$(jq -r '.nodes.vidya.locked.rev // empty' flake.lock)"
      freeq_rev="$$(jq -r '.nodes.freeq.locked.rev // empty' flake.lock)"
      [[ -n "$$vidya_rev" ]] || { echo "vidya rev missing from flake.lock" >&2; exit 1; }
      [[ -n "$$freeq_rev" ]] || { echo "freeq rev missing from flake.lock" >&2; exit 1; }

      clone_pinned() {
        local url="$$1" dest="$$2" rev="$$3"
        echo "--- :git: $$url @ $${rev:0:7} → $$dest"
        rm -rf "$$dest"
        mkdir -p "$$dest"
        git -C "$$dest" init
        git -C "$$dest" remote add origin "$$url"
        git -C "$$dest" fetch --depth 1 origin "$$rev"
        git -C "$$dest" checkout --detach FETCH_HEAD
      }

      clone_pinned https://github.com/codegod100/vidya "$$vidya_dir" "$$vidya_rev"
      if [[ -f patches/vidya-android-winit.patch ]]; then
        patch -p1 -d "$$vidya_dir" < patches/vidya-android-winit.patch
      fi
      clone_pinned https://github.com/codegod100/freeq "$$freeq_dir" "$$freeq_rev"
      [[ -f "$$vidya_dir/Cargo.toml" ]] || { echo "vidya Cargo.toml missing" >&2; exit 1; }
      [[ -f "$$freeq_dir/freeq-sdk/Cargo.toml" ]] || {
        echo "freeq-sdk Cargo.toml missing" >&2
        exit 1
      }

      # Match flake.nix rust-overlay `stable.latest` (deps need ≥1.91; 1.85 is too old).
      if ! command -v rustup >/dev/null 2>&1; then
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
          | sh -s -- -y --default-toolchain stable
        # shellcheck disable=SC1091
        source "$$HOME/.cargo/env"
      fi
      rustup toolchain install stable --profile minimal --component clippy
      rustup default stable
      rustc --version
      cargo --version

      cargo clippy --manifest-path host/Cargo.toml -- -D warnings
      cargo test --manifest-path android/Cargo.toml --lib

  - label: ":android: APK + Flatpak (nixbuild.net)"
    key: artifacts
    # Prefer check first, but still build packages if the cargo host check
    # fails on agent quirks — APK/Flatpak are the primary release artifacts.
    depends_on: check
    allow_dependency_failure: true
    timeout_in_minutes: 180
    command: |
      set -euo pipefail

      chmod +x scripts/ci-nixbuild.sh scripts/fetch-openbao-env.sh

      creds_out="$$(mktemp)"
      ./scripts/ci-nixbuild.sh resolve-creds | tee "$$creds_out"
      # shellcheck disable=SC1090
      eval "$$(grep -E '^(SKIP|NIXBUILD_CREDS_ENV)=' "$$creds_out")"
      if [[ "$${SKIP:-1}" == "1" ]]; then
        echo "--- :warning: Skipping nixbuild artifacts (no nixbuild credentials)"
        echo "Check step still ran; add NIXBUILD_TOKEN on the Default cluster to build APK/Flatpak."
        echo "Scope the secret to pipeline_slug sleek (see cluster Secrets UI)."
        exit 0
      fi
      # shellcheck disable=SC1090
      source "$$NIXBUILD_CREDS_ENV"

      setup_out="$$(mktemp)"
      ./scripts/ci-nixbuild.sh setup | tee "$$setup_out"
      setup_env="$$(sed -n 's/^NIXBUILD_SETUP_ENV=//p' "$$setup_out" | tail -1)"
      [[ -n "$$setup_env" && -f "$$setup_env" ]] || {
        echo "ci-nixbuild setup did not emit NIXBUILD_SETUP_ENV" >&2
        exit 1
      }
      # shellcheck disable=SC1090
      source "$$setup_env"

      ./scripts/ci-nixbuild.sh remote-build ".#android" result-android
      [[ -f result-android/sleek.apk ]] || {
        echo "APK missing under result-android/" >&2
        ls -la result-android >&2 || true
        exit 1
      }
      buildkite-agent artifact upload result-android/sleek.apk

      ./scripts/ci-nixbuild.sh remote-build ".#flatpak" result-flatpak
      bundle="result-flatpak/uk.nandi.sleek.flatpak"
      if [[ ! -s "$$bundle" ]]; then
        bundle="$$(find result-flatpak -maxdepth 1 \( -type f -o -type l \) -name '*.flatpak' | head -1 || true)"
      fi
      [[ -n "$${bundle:-}" && -s "$$bundle" ]] || {
        echo "Flatpak bundle missing under result-flatpak/" >&2
        ls -lah result-flatpak >&2 || true
        exit 1
      }
      ln -f "$$bundle" uk.nandi.sleek.flatpak 2>/dev/null \
        || cp --reflink=auto "$$bundle" uk.nandi.sleek.flatpak
      buildkite-agent artifact upload uk.nandi.sleek.flatpak
