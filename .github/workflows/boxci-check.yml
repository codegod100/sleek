# Native GitHub ↔ boxci bridge: trigger repo-local .boxci/pipeline.yml (trigger=check)
# on pull requests and report the run as a GitHub Actions check.
#
# boxci does the real work (clippy/tests + APK + Flatpak). This workflow only
# dispatches, polls, and fails/succeeds so PRs show a status with a boxci link.
#
# Manual: ./scripts/boxci/dispatch-check.sh

name: boxci

on:
  pull_request:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit SHA to check (default PR head / current SHA)
        required: false
        type: string

concurrency:
  group: boxci-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write
  checks: write

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Resolve SHA
        id: meta
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_SHA:-}" ]]; then
            sha="$INPUT_SHA"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            sha="${{ github.event.pull_request.head.sha }}"
          else
            sha="${{ github.sha }}"
          fi
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
          echo "short=${sha:0:12}" >>"$GITHUB_OUTPUT"

      - name: Trigger boxci check
        id: trigger
        env:
          BOXCI_URL: https://boxci.boxd.sh
          SHA: ${{ steps.meta.outputs.sha }}
        run: |
          set -euo pipefail
          payload="$(jq -n \
            --arg repo_url "https://nandi.radicle.garden/z9mjPzpVK472QXaaP1picc5U9xBR.git" \
            --arg repo "rad:z9mjPzpVK472QXaaP1picc5U9xBR" \
            --arg trigger "check" \
            --arg sha "$SHA" \
            --arg branch "main" \
            --arg github_repo_url "https://github.com/${GITHUB_REPOSITORY}.git" \
            '{
              repo_url: $repo_url,
              repo: $repo,
              trigger: $trigger,
              sha: $sha,
              branch: $branch,
              github_repo_url: $github_repo_url
            }')"
          echo "POST ${BOXCI_URL}/api/runs/from-repo"
          echo "$payload" | jq '{repo, trigger, sha: .sha[0:12], github_repo_url}'
          resp="$(curl -fsSL -X POST "${BOXCI_URL}/api/runs/from-repo" \
            -H "Content-Type: application/json" \
            -d "$payload")"
          echo "$resp" | jq '{id, status, pipeline, duration_s}'
          run_id="$(echo "$resp" | jq -r '.id // empty')"
          [[ -n "$run_id" ]] || { echo "boxci did not return a run id" >&2; exit 1; }
          echo "run_id=$run_id" >>"$GITHUB_OUTPUT"
          echo "run_url=${BOXCI_URL}/runs/${run_id}" >>"$GITHUB_OUTPUT"
          echo "### boxci run" >>"$GITHUB_STEP_SUMMARY"
          echo "[${run_id}](${BOXCI_URL}/runs/${run_id})" >>"$GITHUB_STEP_SUMMARY"

      - name: Mark commit status pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.meta.outputs.sha }}
          RUN_URL: ${{ steps.trigger.outputs.run_url }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
            -f state=pending \
            -f context=boxci \
            -f description="boxci check running" \
            -f target_url="$RUN_URL" >/dev/null

      - name: Poll boxci until finished
        id: poll
        env:
          BOXCI_URL: https://boxci.boxd.sh
          RUN_ID: ${{ steps.trigger.outputs.run_id }}
        run: |
          set -euo pipefail
          # Async runs return quickly; poll until terminal status.
          for i in $(seq 1 480); do
            resp="$(curl -fsSL "${BOXCI_URL}/api/runs/${RUN_ID}")"
            status="$(echo "$resp" | jq -r '.status // empty')"
            echo "[$i] status=$status"
            case "$status" in
              passed|failed|error|cancelled)
                echo "$resp" | jq '{id, status, pipeline, duration_s, steps: [.steps[]? | {key, label, status, exit_code}]}'
                echo "status=$status" >>"$GITHUB_OUTPUT"
                exit 0
                ;;
              running|queued|pending|"")
                sleep 15
                ;;
              *)
                echo "unknown status=$status" >&2
                echo "$resp" | jq . >&2 || true
                sleep 15
                ;;
            esac
          done
          echo "timed out waiting for boxci run $RUN_ID" >&2
          echo "status=error" >>"$GITHUB_OUTPUT"
          exit 1

      - name: Publish commit status
        if: always() && steps.trigger.outputs.run_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.meta.outputs.sha }}
          RUN_URL: ${{ steps.trigger.outputs.run_url }}
          BOXCI_STATUS: ${{ steps.poll.outputs.status }}
        run: |
          set -euo pipefail
          case "${BOXCI_STATUS:-}" in
            passed) state=success; desc="boxci check passed" ;;
            failed) state=failure; desc="boxci check failed" ;;
            cancelled) state=error; desc="boxci check cancelled" ;;
            *) state=error; desc="boxci check ${BOXCI_STATUS:-unknown}" ;;
          esac
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
            -f state="$state" \
            -f context=boxci \
            -f description="$desc" \
            -f target_url="$RUN_URL" >/dev/null
          echo "status=$state description=$desc url=$RUN_URL"
          [[ "$state" == "success" ]]
