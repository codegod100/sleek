# Mirror main to tangled.org/nandi.uk/sleek on every push.
# This is what fires the Tangled webhook → proxy.latha.org →
# BuildBuddy → R2 artifact pipeline.
#
# Requires repository secret DEPLOY_KEY — an SSH private key with
# write access to the Tangled repo (same key the old Tangled Spindle
# workflow used for tag pushes).

name: Mirror to Tangled

on:
  push:
    branches: [main]
  workflow_dispatch:
  # pull_request:closed fires when GitHub's auto-merge lands the PR — this
  # event comes from GitHub's PR system, not the GITHUB_TOKEN push, so it
  # isn't suppressed by GitHub's "GITHUB_TOKEN won't trigger further
  # workflows" restriction. This is the reliable trigger for auto-merged PRs.
  pull_request:
    types: [closed]
    branches: [main]
  # workflow_run on Automerge is kept as a belt-and-suspenders fallback, but
  # note it fires when auto-merge is *enabled* (on PR open/sync), not when
  # the PR is actually merged — so it races the pull_request:closed event.
  # The concurrency cancel-in-progress means whichever fires last wins, and
  # pull_request:closed always fires after the real merge lands.
  workflow_run:
    workflows: ["Automerge"]
    types: [completed]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  mirror:
    name: Push main → tangled.org
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Push to Tangled
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${DEPLOY_KEY:-}" ]]; then
            echo "DEPLOY_KEY secret not set — add it under Settings → Secrets and variables → Actions" >&2
            exit 1
          fi
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/tangled_deploy"
          chmod 600 "$HOME/.ssh/tangled_deploy"
          ssh-keyscan -t rsa,ed25519,ecdsa tangled.org >> "$HOME/.ssh/known_hosts" 2>/dev/null || true
          GIT_SSH_COMMAND="ssh -i $HOME/.ssh/tangled_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            git push git@tangled.org:did:plc:eimwo4adqwppiiweleayixez main
          rm -f "$HOME/.ssh/tangled_deploy"
