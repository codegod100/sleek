# Build flake packages on merge to main and push store paths to Cachix.
# Cache: https://codegod100.cachix.org
#
# Requires repository secret CACHIX_AUTH_TOKEN (write token from
# https://app.cachix.org → codegod100 → Auth tokens).

name: Cachix

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & push (${{ matrix.attr }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Hermetic desktop binary + phone APK (matches just android / nix build).
        attr: [sleek, android]
    steps:
      - uses: actions/checkout@v4

      # Android SDK/NDK + Rust builds need headroom on the default runner disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            accept-flake-config = true

      - uses: cachix/cachix-action@v17
        with:
          name: codegod100
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: nix build .#${{ matrix.attr }}
        run: nix build ".#${{ matrix.attr }}" -L --print-build-logs
