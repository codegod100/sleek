# Build flake packages on merge to main and push store paths to Cachix.
# Builds run on nixbuild.net; Cachix is only for local/substitute pull.
# Cache: https://codegod100.cachix.org
#
# OPENBAO_TOKEN unlocks NIXBUILD_TOKEN + CACHIX_AUTH_TOKEN at runtime.

name: Cachix

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & push (${{ matrix.attr }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Hermetic desktop binary + phone APK (matches just android / nix build).
        attr: [sleek, android]
    steps:
      - uses: actions/checkout@v4

      - name: Fetch secrets from OpenBao
        env:
          OPENBAO_ADDR: https://openbao.boxd.sh
          OPENBAO_TOKEN: ${{ secrets.OPENBAO_TOKEN }}
          OPENBAO_SECRET_PATH: secret/data/ai-api-keys
          OPENBAO_EXTRA_PATHS: secret/data/cachix
        run: |
          set -euo pipefail
          if [[ -z "${OPENBAO_TOKEN:-}" ]]; then
            echo "OPENBAO_TOKEN repository secret is not set" >&2
            exit 1
          fi
          chmod +x scripts/fetch-openbao-env.sh
          ./scripts/fetch-openbao-env.sh --github-env --keys NIXBUILD_TOKEN,CACHIX_AUTH_TOKEN

      - uses: nixbuild/nix-quick-install-action@v35
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          nix_conf: |
            accept-flake-config = true
            experimental-features = nix-command flakes

      - uses: nixbuild/nixbuild-action@v25
        with:
          nixbuild_token: ${{ env.NIXBUILD_TOKEN }}

      - uses: cachix/cachix-action@v17
        with:
          name: codegod100
          authToken: ${{ env.CACHIX_AUTH_TOKEN }}

      - name: nix build .#${{ matrix.attr }}
        run: nix build ".#${{ matrix.attr }}" -L --print-build-logs
