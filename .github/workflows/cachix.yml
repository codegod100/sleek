# Build flake packages on merge to main and push store paths to Cachix.
# Cache: https://codegod100.cachix.org
#
# CACHIX_AUTH_TOKEN is pulled at runtime from OpenBao (openbao.boxd.sh),
# same KV layout as eve (`secret/data/ai-api-keys`, plus `secret/data/cachix`).
#
# Requires repository secret OPENBAO_TOKEN (read token for OpenBao).

name: Cachix

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & push (${{ matrix.attr }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Hermetic desktop binary + phone APK (matches just android / nix build).
        attr: [sleek, android]
    steps:
      - uses: actions/checkout@v4

      # Android SDK/NDK + Rust builds need headroom on the default runner disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - name: Fetch secrets from OpenBao
        env:
          OPENBAO_ADDR: https://openbao.boxd.sh
          OPENBAO_TOKEN: ${{ secrets.OPENBAO_TOKEN }}
          OPENBAO_SECRET_PATH: secret/data/ai-api-keys
          OPENBAO_EXTRA_PATHS: secret/data/cachix
        run: |
          set -euo pipefail
          if [[ -z "${OPENBAO_TOKEN:-}" ]]; then
            echo "OPENBAO_TOKEN repository secret is not set" >&2
            exit 1
          fi
          chmod +x scripts/fetch-openbao-env.sh
          ./scripts/fetch-openbao-env.sh --github-env --keys CACHIX_AUTH_TOKEN

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            accept-flake-config = true

      - uses: cachix/cachix-action@v17
        with:
          name: codegod100
          authToken: ${{ env.CACHIX_AUTH_TOKEN }}

      - name: nix build .#${{ matrix.attr }}
        run: nix build ".#${{ matrix.attr }}" -L --print-build-logs
