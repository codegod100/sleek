# Enable GitHub auto-merge on same-repo PRs once opened/updated.
#
# Fork PRs and drafts are ignored.

name: Automerge

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enable:
    name: Enable auto-merge
    if: >
      github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: gh pr merge --auto --squash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Idempotent: succeeds if auto-merge is already enabled or PR merges.
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --auto --squash
