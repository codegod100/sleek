# Build distributable APK + Flatpak artifacts.
# APK: nix build .#android → sleek.apk
# Flatpak: nix build .#flatpak → uk.nandi.sleek.flatpak
#
# On push to main, pair with cachix.yml (if present) for store-path caching.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: APK (android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Android SDK/NDK + Rust need headroom on the default runner disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            accept-flake-config = true

      # Public substituter only — store pushes belong in cachix.yml on main.
      - uses: cachix/cachix-action@v17
        with:
          name: codegod100
          skipPush: true

      - name: nix build .#android
        run: nix build ".#android" -L --print-build-logs --out-link result-android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sleek-apk
          path: result-android/sleek.apk
          if-no-files-found: error

  flatpak:
    name: Flatpak (desktop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            accept-flake-config = true

      - uses: cachix/cachix-action@v17
        with:
          name: codegod100
          skipPush: true

      - name: nix build .#flatpak
        run: nix build ".#flatpak" -L --print-build-logs --out-link result-flatpak

      - name: Locate Flatpak bundle
        id: bundle
        run: |
          set -euo pipefail
          bundle="$(find result-flatpak -type f -name '*.flatpak' | head -1)"
          [[ -n "${bundle:-}" && -f "$bundle" ]] || {
            echo "No .flatpak under result-flatpak" >&2
            find result-flatpak -maxdepth 3 -type f >&2 || true
            exit 1
          }
          cp "$bundle" uk.nandi.sleek.flatpak
          ls -lh uk.nandi.sleek.flatpak
          echo "path=uk.nandi.sleek.flatpak" >> "$GITHUB_OUTPUT"

      - name: Upload Flatpak
        uses: actions/upload-artifact@v4
        with:
          name: sleek-flatpak
          path: uk.nandi.sleek.flatpak
          if-no-files-found: error
