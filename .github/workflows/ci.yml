# Build distributable APK + Flatpak artifacts on nixbuild.net.
# APK: nix build .#android → sleek.apk
# Flatpak: nix build .#flatpak → uk.nandi.sleek.flatpak
#
# Prefers substitutes from codegod100.cachix.org (trusted keys set in nix_conf).
# NIXBUILD_TOKEN is fetched from OpenBao (same KV as Cachix). Falls back to the
# repository secret nixbuild_token when OPENBAO_TOKEN is unset.

name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: APK (android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch nixbuild token
        id: secrets
        env:
          OPENBAO_ADDR: https://openbao.boxd.sh
          OPENBAO_TOKEN: ${{ secrets.OPENBAO_TOKEN }}
          OPENBAO_SECRET_PATH: secret/data/ai-api-keys
        run: |
          set -euo pipefail
          if [[ -n "${OPENBAO_TOKEN:-}" ]]; then
            chmod +x scripts/fetch-openbao-env.sh
            ./scripts/fetch-openbao-env.sh --github-env --keys NIXBUILD_TOKEN
          elif [[ -n "${{ secrets.nixbuild_token }}" ]]; then
            {
              echo "NIXBUILD_TOKEN<<EOF"
              echo "${{ secrets.nixbuild_token }}"
              echo "EOF"
            } >>"$GITHUB_ENV"
          else
            echo "Set OPENBAO_TOKEN (preferred) or nixbuild_token repository secret" >&2
            exit 1
          fi

      - uses: nixbuild/nix-quick-install-action@v35
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          # Trust Cachix here (not via flake nixConfig): Determinate multi-user
          # ignores flake trusted-public-keys, but GHA single-user needs the key
          # or Build rebuilds rust-default on nixbuild and flakes with EOF.
          nix_conf: |
            accept-flake-config = true
            experimental-features = nix-command flakes
            extra-substituters = https://codegod100.cachix.org
            extra-trusted-public-keys = codegod100.cachix.org-1:LZFL5VrR644WUjleS3bLbVeOdzlXqzKznQWvD5MVthA=

      - uses: nixbuild/nixbuild-action@v25
        with:
          nixbuild_token: ${{ env.NIXBUILD_TOKEN }}
          generate_summary_for: job

      - name: nix build .#android
        run: nix build ".#android" -L --print-build-logs --out-link result-android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sleek-apk
          path: result-android/sleek.apk
          if-no-files-found: error

  flatpak:
    name: Flatpak (desktop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch nixbuild token
        env:
          OPENBAO_ADDR: https://openbao.boxd.sh
          OPENBAO_TOKEN: ${{ secrets.OPENBAO_TOKEN }}
          OPENBAO_SECRET_PATH: secret/data/ai-api-keys
        run: |
          set -euo pipefail
          if [[ -n "${OPENBAO_TOKEN:-}" ]]; then
            chmod +x scripts/fetch-openbao-env.sh
            ./scripts/fetch-openbao-env.sh --github-env --keys NIXBUILD_TOKEN
          elif [[ -n "${{ secrets.nixbuild_token }}" ]]; then
            {
              echo "NIXBUILD_TOKEN<<EOF"
              echo "${{ secrets.nixbuild_token }}"
              echo "EOF"
            } >>"$GITHUB_ENV"
          else
            echo "Set OPENBAO_TOKEN (preferred) or nixbuild_token repository secret" >&2
            exit 1
          fi

      - uses: nixbuild/nix-quick-install-action@v35
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          # Trust Cachix here (not via flake nixConfig): Determinate multi-user
          # ignores flake trusted-public-keys, but GHA single-user needs the key
          # or Build rebuilds rust-default on nixbuild and flakes with EOF.
          nix_conf: |
            accept-flake-config = true
            experimental-features = nix-command flakes
            extra-substituters = https://codegod100.cachix.org
            extra-trusted-public-keys = codegod100.cachix.org-1:LZFL5VrR644WUjleS3bLbVeOdzlXqzKznQWvD5MVthA=

      - uses: nixbuild/nixbuild-action@v25
        with:
          nixbuild_token: ${{ env.NIXBUILD_TOKEN }}
          generate_summary_for: job

      - name: nix build .#flatpak
        id: build
        run: |
          set -euo pipefail
          nix build ".#flatpak" -L --print-build-logs --out-link result-flatpak
          ls -lah result-flatpak/

      - name: Locate Flatpak bundle
        id: bundle
        run: |
          set -euo pipefail
          out="result-flatpak"
          [[ -d "$out" ]] || { echo "flatpak out missing: $out" >&2; exit 1; }
          bundle="$out/uk.nandi.sleek.flatpak"
          if [[ ! -s "$bundle" ]]; then
            bundle="$(find "$out" -maxdepth 1 \( -type f -o -type l \) -name '*.flatpak' | head -1 || true)"
          fi
          if [[ -z "${bundle:-}" || ! -s "$bundle" ]]; then
            echo "No .flatpak bundle in $out" >&2
            ls -lah "$out" >&2 || true
            if [[ -f "$out/flatpak-dir/metadata" ]]; then
              echo "flatpak-dir present but bundle file missing; skipping artifact" >&2
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            exit 1
          fi
          ln -f "$bundle" uk.nandi.sleek.flatpak 2>/dev/null \
            || cp --reflink=auto "$bundle" uk.nandi.sleek.flatpak
          ls -lh uk.nandi.sleek.flatpak
          echo "path=uk.nandi.sleek.flatpak" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Upload Flatpak
        if: steps.bundle.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sleek-flatpak
          path: uk.nandi.sleek.flatpak
          if-no-files-found: error

  # Single required check for branch protection / auto-merge.
  ci:
    name: CI
    if: always()
    needs: [apk, flatpak]
    runs-on: ubuntu-latest
    steps:
      - name: Require APK + Flatpak
        run: |
          set -euo pipefail
          apk="${{ needs.apk.result }}"
          flatpak="${{ needs.flatpak.result }}"
          echo "apk=$apk flatpak=$flatpak"
          [[ "$apk" == success && "$flatpak" == success ]]
