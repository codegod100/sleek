# Deploys cloudflare/proxy-latha-org/worker.js via its own deploy.sh —
# manual only (workflow_dispatch), same rationale as rbe-image.yml: this
# only needs re-running when worker.js/deploy.sh actually change, not on
# every push, and this sandbox/dev machine has no Cloudflare credentials
# of its own — OpenBao (same secret store cachix.yml already pulls from)
# is the only place they live outside a human's own machine.
#
# Expects CLOUDFLARE_API_TOKEN under OpenBao's secret/data/ai-api-keys (or
# wherever OPENBAO_SECRET_PATH points). If missing, fetch-openbao-env.sh
# fails loudly (no partial/silent deploy).
#
# CLOUDFLARE_ACCOUNT_ID isn't a secret in the same sense — not stored in
# OpenBao, just resolved live from the API token itself (GET /accounts).
#
# BUILDBUDDY_API_KEY, TANGLED_WEBHOOK_SECRET and UPLOAD_TOKEN are read
# from OpenBao if already present there, else seeded/generated + persisted
# back (so later runs reuse the same value instead of rotating on every
# deploy — deploy.sh overwrites the live Worker's secret bindings each
# run). BUILDBUDDY_API_KEY isn't randomly generated if missing — it has to
# be the real org key from https://app.buildbuddy.io/ → Settings, so a
# missing copy falls back to the repo secret BUILDBUDDY_API_KEY_FALLBACK
# (never written into any tracked file — same reason .buckconfig.local,
# which holds this same key locally, is gitignored). Only
# TANGLED_WEBHOOK_SECRET has an external dependency (Tangled's own
# Settings → Hooks → Secret config must match), so a freshly generated one
# is printed in the job log as a one-time follow-up instruction.
name: Deploy proxy.latha.org

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch secrets from OpenBao
        env:
          OPENBAO_ADDR: https://openbao.boxd.sh
          OPENBAO_TOKEN: ${{ secrets.OPENBAO_TOKEN }}
          OPENBAO_SECRET_PATH: secret/data/ai-api-keys
        run: |
          set -euo pipefail
          if [[ -z "${OPENBAO_TOKEN:-}" ]]; then
            echo "OPENBAO_TOKEN repository secret is not set" >&2
            exit 1
          fi
          chmod +x scripts/fetch-openbao-env.sh
          ./scripts/fetch-openbao-env.sh --github-env --keys \
            CLOUDFLARE_API_TOKEN

      - name: Read or seed/generate BUILDBUDDY_API_KEY / TANGLED_WEBHOOK_SECRET / UPLOAD_TOKEN
        env:
          OPENBAO_ADDR: https://openbao.boxd.sh
          OPENBAO_TOKEN: ${{ secrets.OPENBAO_TOKEN }}
          OPENBAO_SECRET_PATH: secret/data/ai-api-keys
          # Repo secret, not a literal value in source — see the header
          # comment above for why. Only used as a fallback if OpenBao
          # doesn't already have its own BUILDBUDDY_API_KEY.
          KNOWN_BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY_FALLBACK }}
        run: |
          set -euo pipefail
          chmod +x scripts/openbao-put-key.sh
          for key in BUILDBUDDY_API_KEY TANGLED_WEBHOOK_SECRET UPLOAD_TOKEN; do
            if exports="$(./scripts/fetch-openbao-env.sh --export --keys "$key" 2>/dev/null)"; then
              eval "$exports"
              echo "using existing $key from OpenBao"
            else
              if [[ "$key" == "BUILDBUDDY_API_KEY" ]]; then
                if [[ -z "${KNOWN_BUILDBUDDY_API_KEY:-}" ]]; then
                  echo "BUILDBUDDY_API_KEY missing from OpenBao and no BUILDBUDDY_API_KEY_FALLBACK repo secret set" >&2
                  exit 1
                fi
                val="$KNOWN_BUILDBUDDY_API_KEY"
              else
                val="$(openssl rand -hex 32)"
              fi
              ./scripts/openbao-put-key.sh "$key" --value "$val" >/dev/null
              export "$key=$val"
              if [[ "$key" == "TANGLED_WEBHOOK_SECRET" ]]; then
                echo "generated + stored a NEW $key in OpenBao — paste this into Tangled's Settings > Hooks > Secret for this repo:"
                echo "  $val"
              else
                echo "::add-mask::$val"
                echo "seeded/generated + stored a new $key in OpenBao"
              fi
            fi
            {
              echo "${key}<<EOF"
              echo "${!key}"
              echo "EOF"
            } >>"$GITHUB_ENV"
          done

      - name: Resolve CLOUDFLARE_ACCOUNT_ID from the API token
        run: |
          set -euo pipefail
          id="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            https://api.cloudflare.com/client/v4/accounts | jq -r '.result[0].id')"
          if [[ -z "$id" || "$id" == "null" ]]; then
            echo "could not resolve an account id from this API token" >&2
            exit 1
          fi
          echo "::add-mask::$id"
          echo "CLOUDFLARE_ACCOUNT_ID=$id" >>"$GITHUB_ENV"

      - name: Run worker test suite
        run: node cloudflare/proxy-latha-org/test_worker.mjs

      - name: ./deploy.sh
        working-directory: cloudflare/proxy-latha-org
        run: ./deploy.sh
