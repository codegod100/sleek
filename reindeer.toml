##
## Reindeer config for sleek's host/ Cargo workspace.
##
## Vendors + buckifies host/Cargo.toml's ~938-crate dependency graph into
## third-party/BUCK as native rust_library targets, instead of the
## cargo_genrule black-box (cargo.bzl). Re-run `reindeer buckify` (or
## `reindeer vendor` first, if Cargo.lock changed) after any Cargo.toml/
## Cargo.lock edit — third-party/BUCK is generated, not hand-maintained.
manifest_path = "host/Cargo.toml"
third_party_dir = "third-party"

# Cargo always injects CARGO_PKG_* (and friends) at compile time when
# building a crate's build.rs — including for the build.rs binary itself.
# Buck2's generated rules don't, by default, so any build.rs using
# `env!("CARGO_PKG_NAME")`-style compile-time access (portable-atomic, and
# likely others) fails with "environment variable not defined at compile
# time". Provide them all rather than special-casing per crate.
cargo_env = true

# Without this, reindeer doesn't know how to resolve `cfg(unix)`-style
# conditional dependencies (e.g. jobserver's `libc` dep is unix-only),
# and silently drops them instead of erroring — surfaces later as
# "cannot find module or crate `libc`" mid-build.
[platform.linux-x86_64]
target = "x86_64-unknown-linux-gnu"

[buck]
file_name = "BUCK"
rust_library = "cargo.rust_library"
rust_binary = "cargo.rust_binary"
buildscript_genrule = "buildscript_run"
buckfile_imports = """
load("@prelude//rust:cargo_buildscript.bzl", "buildscript_run")
load("@prelude//rust:cargo_package.bzl", "cargo")
"""
generated_file_header = """
##
## @generated by reindeer
## Do not edit by hand — see reindeer.toml.
##
"""
