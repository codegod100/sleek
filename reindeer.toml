##
## Reindeer config for sleek's host/ Cargo workspace.
##
## Vendors + buckifies host/Cargo.toml's ~938-crate dependency graph into
## third-party/BUCK as native rust_library targets, instead of the
## cargo_genrule black-box (cargo.bzl). Re-run `reindeer buckify` (or
## `reindeer vendor` first, if Cargo.lock changed) after any Cargo.toml/
## Cargo.lock edit — third-party/BUCK is generated, not hand-maintained.
manifest_path = "host/Cargo.toml"
# Generate in the repository-root package so Reindeer can model Cargo path
# dependencies (`android`, `patched-crates/freeq`, and `patched-crates/vidya`)
# as native targets. A BUCK package cannot reference source files owned by a
# parent package, which made the old third-party/BUCK graph inherently unable
# to represent these crates.
third_party_dir = "."

# Cargo always injects CARGO_PKG_* (and friends) at compile time when
# building a crate's build.rs — including for the build.rs binary itself.
# Buck2's generated rules don't, by default, so any build.rs using
# `env!("CARGO_PKG_NAME")`-style compile-time access (portable-atomic, and
# likely others) fails with "environment variable not defined at compile
# time". Provide them all rather than special-casing per crate.
cargo_env = true

# Without this, reindeer doesn't know how to resolve `cfg(unix)`-style
# conditional dependencies (e.g. jobserver's `libc` dep is unix-only),
# and silently drops them instead of erroring — surfaces later as
# "cannot find module or crate `libc`" mid-build.
[platform.linux-x86_64]
target = "x86_64-unknown-linux-gnu"

[buck]
file_name = "BUCK"
rust_library = "cargo.rust_library"
rust_binary = "cargo.rust_binary"
buildscript_genrule = "buildscript_run"
buckfile_imports = """
load("@prelude//rust:cargo_buildscript.bzl", "buildscript_run")
load("@prelude//rust:cargo_package.bzl", "cargo")

# Hand-maintained (not reindeer output) — exposes the patched forks that
# live inside this package (cpal/, egui-winit/, egui_glow/, khronos_api/ —
# real reindeer-buckified git crates, can't move out: reindeer's own vendor
# step re-checks-out cpal here, and its generated `cpal-0.18` rust_library
# target's own srcs list is package-relative, so even other, unrelated
# targets in this file fail to *parse* if the directory isn't here; see
# reindeer.toml's comment on this block, and cargo.bzl's _srcs() for why
# this exists at all: a plain glob() rooted in the *root* BUCK/cargo.bzl
# package can't cross into this one, but a target label like this can).
# glob() here is fine — same package as the files. Keep this list in sync
# with cargo.bzl's cargo genrule srcs comment if another patched fork ever
# needs to stay under third-party/ instead of moving to patched-crates/
# (vidya/, freeq/ — plain filesystem path deps, not reindeer/Cargo.lock
# tracked at all, so they live there instead).
filegroup(
    name = "patched-fork-srcs",
    srcs = glob([
        "third-party/cpal/**",
        "third-party/egui-winit/**",
        "third-party/egui_glow/**",
        "third-party/khronos_api/**",
    ]),
    visibility = ["PUBLIC"],
)
"""
generated_file_header = """
##
## @generated by reindeer
## Do not edit by hand — see reindeer.toml.
##
"""
