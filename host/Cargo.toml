[package]
name = "sleek-host"
version = "0.1.0"
edition = "2021"
description = "Sleek — desktop window host"
license = "MIT"
publish = false

[workspace]

[[bin]]
name = "sleek"
path = "src/main.rs"

[dependencies]
sleek = { path = "../android" }
# Host needs winit backends; android package only enables glow in its base deps.
eframe = { version = "0.31", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
