[package]
name = "sleek-host"
version = "0.1.0"
edition = "2021"
description = "Sleek — desktop window host"
license = "MIT"
publish = false
build = "build.rs"

[workspace]

# Keep in sync with android/Cargo.toml — host is its own workspace root.
# Dev iteration: default rustc debuginfo=2 makes `sleek` ~800MB and slow to link.
# Line tables on workspace crates; no debuginfo on deps (biggest link/disk win).
# Full DWARF: CARGO_PROFILE_DEV_DEBUG=2 cargo build …
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[[bin]]
name = "sleek"
path = "src/relm4.rs"

[[bin]]
name = "sleek-egui"
path = "src/main.rs"

[dependencies]
sleek = { path = "../android" }
freeq-sdk = { path = "../patched-crates/freeq/freeq-sdk", default-features = false, features = [
    "aws-lc-rs",
    "rustls-tls",
    "websocket",
] }
# Host needs winit backends; android package only enables glow in its base deps.
eframe = { version = "0.31", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
# Gleam slash guest (compose-box parser) via wasmtime.
wasmtime = { version = "29", default-features = false, features = [
    "cranelift",
    "runtime",
] }
relm4 = "0.9"
libadwaita = "0.7"

# Same patches as android/ (host is its own workspace root).
[patch.crates-io]
egui-winit = { path = "../third-party/egui-winit" }
# GLES mediump → highp for font-atlas UVs (emilk/egui#6893). Drop on egui ≥ 0.32.
egui_glow = { path = "../third-party/egui_glow" }
# Upstream build.rs bakes an *absolute* env::current_dir()-based path into
# generated include_bytes!() calls — fine under plain `cargo build` (one
# persistent cwd for the whole build), breaks under buck2: the build
# script and the crate's own compile step are separate, independently-
# sandboxed actions, and remote execution tears down the build script's
# cwd before the compile action (possibly on a different machine) reads
# it — "No such file or directory" for every extension.xml. Patch swaps
# the pre-resolved string for a `concat!(env!("CARGO_MANIFEST_DIR"), ...)`
# literal in the *generated* source, so it's resolved fresh at whatever
# action actually compiles khronos_api, using that action's own (always
# correct) CARGO_MANIFEST_DIR instead of the build script's.
khronos_api = { path = "../third-party/khronos_api" }
# Pin rev (not floating main) — same as freeq Cargo.lock; main tip is 1.1.0 and breaks iroh 0.97.
noq = { git = "https://github.com/n0-computer/noq", rev = "ab042ea7e3f7bae1e43eaba2ac9dba47ddb52e69" }
noq-proto = { git = "https://github.com/n0-computer/noq", rev = "ab042ea7e3f7bae1e43eaba2ac9dba47ddb52e69" }
noq-udp = { git = "https://github.com/n0-computer/noq", rev = "ab042ea7e3f7bae1e43eaba2ac9dba47ddb52e69" }
iroh = { git = "https://github.com/n0-computer/iroh", rev = "8af8370b" }
iroh-base = { git = "https://github.com/n0-computer/iroh", rev = "8af8370b" }
iroh-relay = { git = "https://github.com/n0-computer/iroh", rev = "8af8370b" }
iroh-gossip = { git = "https://github.com/n0-computer/iroh-gossip", rev = "1038f721" }
web-transport-iroh = { git = "https://github.com/Frando/web-transport", rev = "f7a523f1" }
web-transport-noq = { git = "https://github.com/Frando/web-transport", rev = "f7a523f1" }
web-transport-proto = { git = "https://github.com/Frando/web-transport", rev = "f7a523f1" }
web-transport-trait = { git = "https://github.com/Frando/web-transport", rev = "f7a523f1" }

# moq-media depends on cpal git `branch = "master"` (floats). Pin via path so
# Cargo.lock cannot pick a master tip that dropped StreamError / Device::name().
# Same rev freeq locks: 63ea9fffbd3b15af0180f0800a61a3c4fec9b88a
[patch."https://github.com/RustAudio/cpal.git"]
cpal = { path = "../third-party/cpal" }

# See android/Cargo.toml — feature-unify native PipeWire host for moq-media audio.
[target.'cfg(not(target_os = "android"))'.dependencies]
cpal = { path = "../third-party/cpal", features = ["pipewire"] }
