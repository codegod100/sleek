# sleek merge CI — check + APK + Flatpak after merge to main.
#
# Issue→patch is builtin to boxci (POST /api/webhooks/garden/issue, /api/poll).
# This file only defines merge builds (on: merge).
#
# boxci publishes a Radicle Job COB (xyz.radworks.job) for each merge run so
# Desktop/Explorer show CI status + a log link back to https://boxci.boxd.sh
# (or https://boxci.latha.org on the Cloudflare Containers runner).
#
# Runner notes (CF Containers dockerTools image): bash/git/nix/coreutils only —
# no apt-get, often no jq/grep/patch/sudo. Missing host tools are pulled via
# `nix shell` from nixpkgs; flake config is set with NIX_CONFIG (no sudo).

name: sleek
on:
  - merge

env:
  RUST_BACKTRACE: "1"
  GIT_TERMINAL_PROMPT: "0"

steps:
  # Fast heartbeat so Job COB start is visible before the heavy check/APK steps.
  - label: ":radar: Job COB probe"
    key: job-probe
    if: build.env("BOXCI_TRIGGER") == "merge"
    command: |
      set -euo pipefail
      echo "boxci merge run ${BOXCI_RUN_ID:-?} for ${GIT_SHA:-unknown}"
      echo "Job COB log URL base: ${BOXCI_PUBLIC_URL:-https://boxci.boxd.sh}"
      echo "repo ${BOXCI_REPO_ID:-${RADICLE_RID:-?}} slug=${BOXCI_REPO_SLUG:-?}"

  # REMOVED (was "disk-gc" / "Free disk space", added in #93): `nix store gc`
  # ran unconditionally on the shared, long-lived CF Containers runner, which
  # runs boxci-server (and rad-job) straight out of /nix/store with
  # NIX_REMOTE=local and no daemon — nothing registers those live process
  # store paths as GC roots. Every run of this step deleted the running
  # server's own runtime deps (e.g. radicle-job-0.6.0), even with plenty of
  # free disk. Do not reintroduce `nix store gc` here without registering
  # proper GC roots for the container's live runtime first.

  - label: ":rust: Check"
    key: check
    if: build.env("BOXCI_TRIGGER") == "merge"
    depends_on: job-probe
    command: |
      set -euo pipefail
      cd "${BOXCI_REPO_ROOT:?}"

      if ! command -v nix >/dev/null 2>&1; then
        if ! command -v curl >/dev/null 2>&1; then
          echo "nix and curl both missing; cannot bootstrap" >&2
          exit 1
        fi
        curl --proto '=https' --tlsv1.2 -sSf -L \
          https://install.determinate.systems/nix \
          | sh -s -- install linux --no-confirm --init none
        # shellcheck disable=SC1091
        . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh || true
        export PATH="/nix/var/nix/profiles/default/bin:$PATH"
      fi

      # Prefer process NIX_CONFIG over writing /etc/nix (no sudo on CF image).
      export NIX_CONFIG=$'experimental-features = nix-command flakes\naccept-flake-config = true'

      if [[ ! -S /nix/var/nix/daemon-socket/socket ]]; then
        if command -v sudo >/dev/null 2>&1; then
          sudo /nix/var/nix/profiles/default/bin/nix daemon >/tmp/nix-daemon-check.log 2>&1 &
          for _ in $(seq 1 30); do
            [[ -S /nix/var/nix/daemon-socket/socket ]] && break
            sleep 1
          done
        else
          echo "no sudo and no nix daemon socket; using single-user nix"
        fi
      fi

      if command -v sudo >/dev/null 2>&1 && command -v grep >/dev/null 2>&1; then
        sudo mkdir -p /etc/nix
        if ! sudo grep -q 'accept-flake-config' /etc/nix/nix.conf 2>/dev/null; then
          echo 'accept-flake-config = true' | sudo tee -a /etc/nix/nix.conf >/dev/null
        fi
      fi

      # Host tools missing on the CF Containers image → nixpkgs via nix shell.
      pkgs=()
      command -v jq >/dev/null 2>&1 || pkgs+=(nixpkgs#jq)
      command -v grep >/dev/null 2>&1 || pkgs+=(nixpkgs#gnugrep)
      command -v patch >/dev/null 2>&1 || pkgs+=(nixpkgs#gnupatch)
      command -v curl >/dev/null 2>&1 || pkgs+=(nixpkgs#curl)

      run_under_tools() {
        if ((${#pkgs[@]})); then
          echo "--- :nix: shell (${pkgs[*]})"
          nix --option accept-flake-config true shell "${pkgs[@]}" --command bash -c "$1"
        else
          bash -c "$1"
        fi
      }

      run_under_tools '
        set -euo pipefail
        cd "${BOXCI_REPO_ROOT:?}"
        command -v jq >/dev/null 2>&1 || { echo "jq required" >&2; exit 1; }
        command -v patch >/dev/null 2>&1 || { echo "patch required" >&2; exit 1; }

        bash scripts/sync-flake-path-deps.sh
        parent="$(dirname "${BOXCI_REPO_ROOT:?}")"
        [[ -f "$parent/vidya/Cargo.toml" ]] || { echo "vidya Cargo.toml missing at $parent/vidya" >&2; exit 1; }
        [[ -f "$parent/freeq/freeq-sdk/Cargo.toml" ]] || {
          echo "freeq-sdk Cargo.toml missing at $parent/freeq/freeq-sdk" >&2
          exit 1
        }

        echo "--- :nix: develop (mold + rustc from flake)"
        nix develop --option accept-flake-config true --command bash -lc "
          set -euo pipefail
          command -v mold >/dev/null
          rustc --version
          cargo --version
          cargo clippy --manifest-path host/Cargo.toml -- -D warnings
          cargo test --manifest-path android/Cargo.toml --lib
        " </dev/null
      '

  - label: ":android: APK (nixbuild.net)"
    key: apk
    if: build.env("BOXCI_TRIGGER") == "merge"
    depends_on: check
    allow_dependency_failure: true
    command: |
      set -euo pipefail
      cd "${BOXCI_REPO_ROOT:?}"
      slug="${BOXCI_REPO_SLUG:-sleek}"
      artifacts="${BOXCI_ROOT:?}/artifacts/${slug}/${BOXCI_RUN_ID:?}"
      mkdir -p "$artifacts"

      export NIX_CONFIG=$'experimental-features = nix-command flakes\naccept-flake-config = true'

      pkgs=()
      command -v jq >/dev/null 2>&1 || pkgs+=(nixpkgs#jq)
      command -v grep >/dev/null 2>&1 || pkgs+=(nixpkgs#gnugrep)
      command -v curl >/dev/null 2>&1 || pkgs+=(nixpkgs#curl)
      if ((${#pkgs[@]})); then
        echo "--- :nix: shell (${pkgs[*]})"
        # shellcheck disable=SC2016
        eval "$(nix --option accept-flake-config true shell "${pkgs[@]}" --command bash -c 'printf "export PATH=%q\n" "$PATH"')"
      fi

      chmod +x scripts/ci-nixbuild.sh scripts/fetch-openbao-env.sh

      creds_out="$(mktemp)"
      ./scripts/ci-nixbuild.sh resolve-creds | tee "$creds_out"
      # shellcheck disable=SC1090
      eval "$(grep -E '^(SKIP|NIXBUILD_CREDS_ENV)=' "$creds_out")"
      if [[ "${SKIP:-1}" == "1" ]]; then
        echo "--- :warning: Skipping APK (no nixbuild credentials)"
        exit 0
      fi
      # shellcheck disable=SC1090
      source "$NIXBUILD_CREDS_ENV"

      setup_out="$(mktemp)"
      ./scripts/ci-nixbuild.sh setup | tee "$setup_out"
      setup_env="$(sed -n 's/^NIXBUILD_SETUP_ENV=//p' "$setup_out" | tail -1)"
      [[ -n "$setup_env" && -f "$setup_env" ]] || {
        echo "ci-nixbuild setup did not emit NIXBUILD_SETUP_ENV" >&2
        exit 1
      }
      # shellcheck disable=SC1090
      source "$setup_env"

      ./scripts/ci-nixbuild.sh remote-build ".#android" result-android sleek.apk
      [[ -s result-android/sleek.apk ]] || {
        echo "APK missing under result-android/" >&2
        ls -la result-android >&2 || true
        exit 1
      }
      cp --reflink=auto result-android/sleek.apk "$artifacts/sleek.apk"
      ls -lh "$artifacts/sleek.apk"
      echo "artifact=$artifacts/sleek.apk"

  - label: ":package: Flatpak (nixbuild.net)"
    key: flatpak
    if: build.env("BOXCI_TRIGGER") == "merge"
    depends_on: check
    allow_dependency_failure: true
    command: |
      set -euo pipefail
      cd "${BOXCI_REPO_ROOT:?}"
      slug="${BOXCI_REPO_SLUG:-sleek}"
      artifacts="${BOXCI_ROOT:?}/artifacts/${slug}/${BOXCI_RUN_ID:?}"
      mkdir -p "$artifacts"

      export NIX_CONFIG=$'experimental-features = nix-command flakes\naccept-flake-config = true'

      pkgs=()
      command -v jq >/dev/null 2>&1 || pkgs+=(nixpkgs#jq)
      command -v grep >/dev/null 2>&1 || pkgs+=(nixpkgs#gnugrep)
      command -v curl >/dev/null 2>&1 || pkgs+=(nixpkgs#curl)
      if ((${#pkgs[@]})); then
        echo "--- :nix: shell (${pkgs[*]})"
        # shellcheck disable=SC2016
        eval "$(nix --option accept-flake-config true shell "${pkgs[@]}" --command bash -c 'printf "export PATH=%q\n" "$PATH"')"
      fi

      chmod +x scripts/ci-nixbuild.sh scripts/fetch-openbao-env.sh

      creds_out="$(mktemp)"
      ./scripts/ci-nixbuild.sh resolve-creds | tee "$creds_out"
      # shellcheck disable=SC1090
      eval "$(grep -E '^(SKIP|NIXBUILD_CREDS_ENV)=' "$creds_out")"
      if [[ "${SKIP:-1}" == "1" ]]; then
        echo "--- :warning: Skipping Flatpak (no nixbuild credentials)"
        exit 0
      fi
      # shellcheck disable=SC1090
      source "$NIXBUILD_CREDS_ENV"

      setup_out="$(mktemp)"
      ./scripts/ci-nixbuild.sh setup | tee "$setup_out"
      setup_env="$(sed -n 's/^NIXBUILD_SETUP_ENV=//p' "$setup_out" | tail -1)"
      [[ -n "$setup_env" && -f "$setup_env" ]] || {
        echo "ci-nixbuild setup did not emit NIXBUILD_SETUP_ENV" >&2
        exit 1
      }
      # shellcheck disable=SC1090
      source "$setup_env"

      ./scripts/ci-nixbuild.sh remote-build ".#flatpak" result-flatpak \
        uk.nandi.sleek.flatpak
      bundle="result-flatpak/uk.nandi.sleek.flatpak"
      [[ -s "$bundle" ]] || {
        echo "Flatpak bundle missing under result-flatpak/" >&2
        ls -lah result-flatpak >&2 || true
        exit 1
      }
      cp --reflink=auto "$bundle" "$artifacts/uk.nandi.sleek.flatpak"
      ls -lh "$artifacts/uk.nandi.sleek.flatpak"
      echo "artifact=$artifacts/uk.nandi.sleek.flatpak"
