<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Sleek">
  <defs>
    <!-- Freeq-family cyan → lavender → pink -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1d2e"/>
      <stop offset="55%" stop-color="#252a40"/>
      <stop offset="100%" stop-color="#2a2340"/>
    </linearGradient>
    <linearGradient id="bubble" x1="12%" y1="8%" x2="92%" y2="95%">
      <stop offset="0%" stop-color="#5CE1E6"/>
      <stop offset="45%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#FF6BCB"/>
    </linearGradient>
    <linearGradient id="bubbleSoft" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0ABFC"/>
      <stop offset="100%" stop-color="#67E8F9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Soft squircle app tile -->
  <rect x="24" y="24" width="464" height="464" rx="108" ry="108" fill="url(#bg)"/>
  <!-- subtle rim -->
  <rect x="24" y="24" width="464" height="464" rx="108" ry="108"
        fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>

  <!-- Main chat bubble (rounded, with cute tail) -->
  <g filter="url(#glow)">
    <path fill="url(#bubble)" d="
      M 148 148
      C 148 118, 172 98, 206 98
      L 320 98
      C 354 98, 378 122, 378 156
      L 378 248
      C 378 282, 354 306, 320 306
      L 248 306
      L 198 352
      C 192 357, 182 353, 182 345
      L 182 306
      L 206 306
      C 172 306, 148 282, 148 248
      Z"/>
  </g>

  <!-- Gloss highlight on bubble -->
  <path fill="url(#bubbleSoft)" d="
    M 168 130
    C 178 112, 210 106, 248 106
    L 310 106
    C 340 106, 358 122, 362 148
    C 340 132, 300 124, 248 124
    C 210 124, 180 132, 168 148
    Z"/>

  <!-- Message lines (soft white, "sleek" minimal) -->
  <g fill="#ffffff" fill-opacity="0.92">
    <rect x="188" y="156" width="152" height="22" rx="11"/>
    <rect x="188" y="198" width="118" height="22" rx="11" fill-opacity="0.72"/>
    <rect x="188" y="240" width="88" height="22" rx="11" fill-opacity="0.48"/>
  </g>

  <!-- Cute little sparkle (top-right) -->
  <g fill="url(#spark)" transform="translate(372 118)">
    <path d="M0 -28 L6 -8 L26 0 L6 8 L0 28 L-6 8 L-26 0 L-6 -8 Z"/>
  </g>
  <!-- Tiny second sparkle -->
  <g fill="#67E8F9" fill-opacity="0.9" transform="translate(402 168) scale(0.45)">
    <path d="M0 -28 L6 -8 L26 0 L6 8 L0 28 L-6 8 L-26 0 L-6 -8 Z"/>
  </g>
</svg>
